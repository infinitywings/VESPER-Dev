name: Bug report
description: Report a reproducible problem in a VESPER workflow.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use a minimal synthetic example. Do not include credentials, private household data, or cloud device identifiers. Report security issues privately using SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Checkout commit or version
      description: Run git rev-parse --short HEAD in your checkout.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, CPU architecture, Python version, and relevant optional dependencies.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow
      options:
        - Offline demo or software sensors
        - Geometric sensors
        - Habitat or resident activity
        - Platform connector
        - Dataset or research artifact
        - Documentation or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact command and the smallest synthetic configuration needed to reproduce the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Explain what should happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Remove tokens, real device IDs, personal paths, and private data before posting.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no credentials or private household data.
          required: true
