[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vesper"
version = "0.1.0"
description = "Activity-conditioned smart-home simulation and experimentation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Huan Bui"},
    {name = "Chenglong Fu", email = "chenglong.fu@charlotte.edu"},
]
keywords = ["habitat", "simulation", "iot", "robotics", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6.0",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
# Habitat-Sim/Lab are installed separately from their upstream distributions.
visualization = ["pygame>=2.5", "omegaconf>=2.3"]
llm = [
    "openai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
network = [
    "aiohttp>=3.8",
    "websockets>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "paho-mqtt>=2.0",
]
dataset = ["pandas>=2.0", "pyarrow>=14", "scikit-learn>=1.6", "scapy>=2.5"]
dev = [
    "pytest>=7.0,<10",
    "pytest-cov",
    "pytest-asyncio",
]
lint = ["black", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/infinitywings/VESPER-Dev"
Documentation = "https://github.com/infinitywings/VESPER-Dev#readme"
Repository = "https://github.com/infinitywings/VESPER-Dev"

[tool.setuptools.packages.find]
where = ["."]
include = ["vesper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
