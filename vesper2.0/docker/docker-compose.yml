version: "3.8"

# VESPER Virtual IoT Device Fleet
# Each service is a Docker container running QEMU firmware
#
# Network modes (set VESPER_NET_MODE env var):
#   bridge  (default) — isolated Docker bridge; Wireshark captures on docker0/veth
#   macvlan           — real LAN IPs; Wireshark captures on parent WiFi/eth iface
#
# Usage:
#   docker compose up -d                               # bridge mode (default)
#   VESPER_NET_MODE=macvlan VESPER_PARENT_IF=en0 docker compose up -d  # macvlan

services:
  # ── MQTT Broker (Mosquitto) ────────────────────────────────────────────────
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: vesper-mqtt
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "9001:9001"
    networks:
      vesper-net:
        ipv4_address: 172.20.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── IoT Device Containers ──────────────────────────────────────────────────
  kitchen-light:
    build:
      context: ..
      dockerfile: docker/Dockerfile.device
    container_name: vesper-kitchen-light
    environment:
      - DEVICE_ID=vesper-fw-kitchen
      - DEVICE_NAME=Kitchen Light
      - SERIAL_PORT=5555
    ports:
      - "15001:5555"
    networks:
      vesper-net:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

  living-room:
    build:
      context: ..
      dockerfile: docker/Dockerfile.device
    container_name: vesper-living-room
    environment:
      - DEVICE_ID=vesper-fw-living
      - DEVICE_NAME=Living Room Light
      - SERIAL_PORT=5555
    ports:
      - "15002:5555"
    networks:
      vesper-net:
        ipv4_address: 172.20.0.11
    restart: unless-stopped

  bedroom-light:
    build:
      context: ..
      dockerfile: docker/Dockerfile.device
    container_name: vesper-bedroom-light
    environment:
      - DEVICE_ID=vesper-fw-bedroom
      - DEVICE_NAME=Bedroom Light
      - SERIAL_PORT=5555
    ports:
      - "15003:5555"
    networks:
      vesper-net:
        ipv4_address: 172.20.0.12
    restart: unless-stopped

# ── Configurable Network ─────────────────────────────────────────────────────
# Default: bridge mode.  Override with VESPER_NET_MODE=macvlan.
networks:
  vesper-net:
    name: vesper-home-network
    driver: ${VESPER_NET_MODE:-bridge}
    driver_opts:
      parent: ${VESPER_PARENT_IF:-}          # macvlan only: WiFi/eth parent iface
      macvlan_mode: ${VESPER_MACVLAN_MODE:-bridge}
    ipam:
      config:
        - subnet: ${VESPER_SUBNET:-172.20.0.0/24}
          gateway: ${VESPER_GATEWAY:-172.20.0.1}
