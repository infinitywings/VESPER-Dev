# VESPER Mosquitto Configuration
# Real MQTT 3.1.1 broker for protocol-authentic traffic capture

# ── Listeners ────────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT clients / debugging)
listener 9001
protocol websockets

# ── Authentication ───────────────────────────────────────────────────────────
# Allow anonymous for research testbed; enable auth for production
allow_anonymous true

# ── Persistence ──────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ──────────────────────────────────────────────────────────────────
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
